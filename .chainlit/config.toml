[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

# Lets users attach PDF and text files with the paperclip button
[features.spontaneous_file_upload]
    enabled = true
    accept = ["application/pdf", "text/plain"]
    max_files = 5
    max_size_mb = 10

[features.audio]
    enabled = false
    sample_rate = 24000

[features.mcp]
    enabled = false

    [features.mcp.user_servers]
        enabled = false
        allowed_urls = []

[UI]
name = "DocuMind"
default_theme = "dark"
confirm_new_chat = true
cot = "full"
custom_css = "/public/custom.css"
alert_style = "classic"
logo_file_url = "/public/logo.png"
default_avatar_file_url = ""

[meta]
generated_by = "2.12.0"